# Copies quay-pull-secret and quay-cdi-secret from the qradar-media namespace
# into this instance namespace so CDI and virt-launcher can pull from Quay.
#
# Credentials never appear in Git — the source secrets live only in the cluster,
# created once by the operator in qradar-media via:
#   oc create secret docker-registry quay-pull-secret \
#     --docker-server=<registry> --docker-username=<user> --docker-password=<pass> \
#     -n qradar-media
#   oc create secret generic quay-cdi-secret \
#     --from-literal=accessKeyId=<user> --from-literal=secretKey=<pass> \
#     -n qradar-media
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: qradar-secret-copier
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "qradar-ha.labels" . | nindent 4 }}
  annotations:
    # This SA is used only by the secret-copy Job and can be deleted after first sync.
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: qradar-secret-copier-{{ .Release.Namespace }}
  labels:
    {{- include "qradar-ha.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: qradar-secret-reader
subjects:
  - kind: ServiceAccount
    name: qradar-secret-copier
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: quay-secret-copy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "qradar-ha.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 120
  template:
    spec:
      serviceAccountName: qradar-secret-copier
      restartPolicy: OnFailure
      {{- if .Values.toolImage.pullSecret }}
      imagePullSecrets:
        - name: {{ .Values.toolImage.pullSecret }}
      {{- end }}
      containers:
        - name: copy
          image: "{{ .Values.toolImage.repository }}:{{ .Values.toolImage.tag }}"
          imagePullPolicy: {{ .Values.toolImage.pullPolicy }}
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              SOURCE_NS="qradar-media"
              DEST_NS="{{ .Release.Namespace }}"

              for SECRET in quay-pull-secret quay-cdi-secret; do
                echo "Copying $SECRET from $SOURCE_NS to $DEST_NS"
                oc get secret "$SECRET" -n "$SOURCE_NS" -o json \
                  | python3 -c "
              import sys, json
              s = json.load(sys.stdin)
              # Strip server-side fields so apply works cleanly
              for f in ['resourceVersion','uid','creationTimestamp','managedFields']:
                  s['metadata'].pop(f, None)
              s['metadata']['namespace'] = sys.argv[1]
              print(json.dumps(s))
              " "$DEST_NS" \
                  | oc apply -n "$DEST_NS" -f -
                echo "$SECRET copied successfully"
              done
