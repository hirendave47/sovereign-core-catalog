# Pull secrets for the private Quay registry are NOT rendered by this chart.
#
# They are copied into the instance namespace at sync time by the quay-secret-copy
# Job (secret-copy-job.yaml), which reads from the qradar-media namespace.
#
# The source secrets must be created ONCE per cluster by an operator:
#
#   REGISTRY="registry-quay-quay-enterprise.apps.<domain>"
#
#   oc create secret docker-registry quay-pull-secret \
#     --docker-server="${REGISTRY}" \
#     --docker-username=quayadmin \
#     --docker-password='<password>' \
#     -n qradar-media
#
#   oc create secret generic quay-cdi-secret \
#     --from-literal=accessKeyId=quayadmin \
#     --from-literal=secretKey='<password>' \
#     -n qradar-media
#
# No credentials are stored in Git or in this chart.
