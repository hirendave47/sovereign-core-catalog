# QRadar HA Helm Chart — Default Values
#
# These values are the authoritative defaults for all static configuration.
# Per-instance overrides are supplied by the broker in instances/<name>/values.yaml
# (or via -f values.yaml / --set when using helm install directly).
#
# Network addresses are FIXED across all instances — namespace isolation provides
# per-instance separation. Do not change these unless you are changing the HA model.

# ---------------------------------------------------------------------------
# Deployment topology
# ---------------------------------------------------------------------------
# ha         — two-node HA pair (primary + secondary VM, fixed 10.0.0.x private net)
# standalone — single console VM (DHCP networking, no secondary, no NAD)
topology: ha

# ---------------------------------------------------------------------------
# Standalone-specific values (used only when topology=standalone)
# ---------------------------------------------------------------------------
standalone:
  # Optional FQDN override. If blank, derived as <release-name>.<network.domainName>
  hostname: ""

# ---------------------------------------------------------------------------
# Instance-specific values (set at provision time by broker or helm install -f)
# ---------------------------------------------------------------------------
qradar:
  dnsPrimary: ""          # Required: primary DNS server IP
  dnsSecondary: ""        # Required: secondary DNS server IP
  adminPassword: ""       # Required: QRadar admin user password
  rootPassword: ""        # Required: VM root user password
  securityTemplate: Enterprise
  timezone: UTC

plan: medium              # tiny | small | medium | large

# ---------------------------------------------------------------------------
# Plan-based resource sizing
# ---------------------------------------------------------------------------
plans:
  tiny:
    cpuCores: 8
    memoryGb: 32
    storageGb: 250
  small:
    cpuCores: 16
    memoryGb: 64
    storageGb: 250
  medium:
    cpuCores: 24
    memoryGb: 96
    storageGb: 250
  large:
    cpuCores: 48
    memoryGb: 192
    storageGb: 500

# ---------------------------------------------------------------------------
# Fixed HA network addresses (do not change for normal deployments)
# ---------------------------------------------------------------------------
network:
  virtualIp: "10.0.0.1"       # HA VIP — floating cluster address (configured during HA pairing)
  primaryIp: "10.0.0.10"      # Primary fixed management IP during initial install
  secondaryIp: "10.0.0.11"    # Secondary static IP
  haPrefix: 24
  netmask: "255.255.255.0"
  domainName: "qradar.lab"
  primaryHostname: "console.qradar.lab"
  secondaryHostname: "standby.qradar.lab"

# ---------------------------------------------------------------------------
# Storage
# ---------------------------------------------------------------------------
storage:
  # StorageClass for VM root-disk PVCs created by CDI.
  # Run `oc get sc` to list available storage classes on your cluster.
  # Set to the name of a RWO-capable block storage class.
  #
  #   Option A — OpenShift Data Foundation (ODF/OCS) — most IBM-deployed clusters
  #     storageClassName: ocs-storagecluster-ceph-rbd
  #
  #   Option B — Platform Ceph RBD — used on some clusters (e.g. Fyre/demo environments)
  #     storageClassName: ceph-rbd-platform
  #
  #   Option C — Standard/default storage class (single-node, dev, or custom clusters)
  #     storageClassName: ""   # leave empty to use the cluster default StorageClass
  #
  storageClassName: ""   # empty = use the cluster default StorageClass
  # dockerconfigjson secret — used by virt-launcher to pull containerDisk images.
  # Created by this chart when quayPullSecretB64 is set, or pre-created out-of-band.
  imagePullSecret: quay-pull-secret
  # Opaque secret (accessKeyId / secretKey) — used by CDI importer to pull DataVolume
  # registry source images. CDI does not understand dockerconfigjson format.
  # Created by this chart when quayUsername and quayPassword are set.
  cdiPullSecret: quay-cdi-secret
  goldenDisk:
    image: "registry-quay-quay-enterprise.apps.devit88.sc.fyreservices.com/quayadmin/rhel8-qradar-golden:8.10"
    size: "250Gi"
  installationIso:
    image: "registry-quay-quay-enterprise.apps.devit88.sc.fyreservices.com/quayadmin/qradar-installation-cdrom:latest"

# ---------------------------------------------------------------------------
# Tool image for the secret-copy sync hook Job
# ---------------------------------------------------------------------------
# This Job needs a container with `oc` (or `kubectl`) + `python3` to copy
# the Quay pull secrets from the qradar-media namespace into the instance
# namespace at deploy time.
#
# Choose the option that matches your cluster environment:
#
#   Option A — Red Hat connected cluster (requires registry.redhat.io pull secret)
#   ❌ Will fail if the cluster has no Red Hat subscription or global pull secret.
#     repository: registry.redhat.io/openshift4/ose-cli
#     tag: latest
#
#   Option B — Internal OpenShift image registry (air-gapped, no external access needed)
#   ❌ Will fail if the cluster's internal registry is not deployed (ManagementState: Removed).
#   ✅ Works on most standard OpenShift installs — the 'cli' ImageStream ships in every cluster.
#     repository: image-registry.openshift-image-registry.svc:5000/openshift/cli
#     tag: latest
#
#   Option C — Public quay.io (no authentication required) ✅ RECOMMENDED for new clusters
#   ✅ Works on any cluster with outbound internet access to quay.io.
#   ✅ No pull secret required.  Includes both `oc` and `python3`.
#     repository: quay.io/openshift/origin-cli
#     tag: latest
#
#   Option D — Mirrored / private registry
#   Use when quay.io is not reachable (fully air-gapped) and you have a local mirror.
#   Set pullSecret to the name of a pre-existing kubernetes.io/dockerconfigjson Secret
#   in the release namespace — credentials are NEVER placed directly in values.yaml.
#     repository: my-mirror.example.com/openshift4/ose-cli
#     tag: latest
#     pullSecret: my-mirror-pull-secret
#
# pullSecret is OPTIONAL — omit (or leave "") for Options A, B, and C.
toolImage:
  repository: quay.io/openshift/origin-cli
  tag: latest
  pullPolicy: IfNotPresent
  pullSecret: ""   # optional: name of an existing imagePullSecret in the release namespace

# ---------------------------------------------------------------------------
# Readiness probe
# ---------------------------------------------------------------------------
readiness:
  initialDelaySeconds: 30
  periodSeconds: 20
  failureThreshold: 2
  successThreshold: 1
