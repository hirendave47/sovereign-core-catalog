apiVersion: sovereign-catalog.io/v1alpha1
kind: SoftwareListing
metadata:
  companyRef: "companies/open-source"
  vendor: "Apache Software Foundation"
  product: "Apache Kafka"
  shortDescription: "Open-source distributed event streaming platform for publishing, storing, and processing streams of events in real-time — powering data pipelines, event-driven architectures, and mission-critical applications at scale."
  fullDescription: "Apache Kafka is an open-source event streaming platform that combines three fundamental capabilities in a single, battle-tested solution: publishing and subscribing to streams of events with continuous import/export from external systems; storing those event streams durably and reliably for as long as required; and processing streams both in real-time and retrospectively. All of this is delivered in a distributed, highly scalable, elastic, fault-tolerant, and secure manner. Kafka can be deployed on bare-metal hardware, virtual machines, and containers, on-premises or in the cloud, with the option to self-manage or use fully managed vendor services. Architecturally, Kafka runs as a cluster of servers spanning multiple datacenters or cloud regions. Brokers form the storage layer, while Kafka Connect servers continuously import and export data to integrate with relational databases and other systems. If any server fails, the remaining cluster members take over automatically with no data loss. Client libraries are available for Java, Scala, Go, Python, C/C++, and many other languages, as well as REST APIs. Events are organized into topics, which are partitioned across brokers for parallel read/write at scale. Topics are replicated — typically with a factor of three — across brokers and even geo-regions, ensuring high availability. Producers and consumers are fully decoupled, and Kafka guarantees exactly-once processing semantics. Five core APIs cover administration, producing, consuming, stream processing via the Kafka Streams library, and reusable data integration via Kafka Connect. Common use cases include real-time payment processing, logistics tracking, IoT sensor data collection, customer interaction analytics, patient monitoring, and serving as the backbone for microservices and event-driven architectures."
  sovereignCoreRelevance: "Enables air-gapped, on-premises event streaming without any external broker dependency, supporting compliant data movement within sovereign perimeters."
  category: "infrastructure"
  industries: ["bfsi", "government", "healthcare", "telco", "energy"]
  intendedUsers: ["Platform engineers", "Data engineers", "Integration architects"]
  version: "4.0.0"
  lifecycleStatus: "approved"
  storefrontVisibility: "public"
  availabilityState: "available_central_it"
spec:
  openSource:
    enabled: true
    license: "Apache-2.0"
    upstreamProject: "https://github.com/apache/kafka"
    upstreamVersion: "4.0.0"
  architecture:
    format: "Kubernetes"
    airgapReady: true
    dependencyEndpoints: []
    storage:
      csiAccessModes: ["ReadWriteOnce"]
      volumeSnapshotSupport: true
  security:
    podSecurityStandard: "baseline"
    requiresClusterAdmin: false
    readOnlyRootFilesystem: false
    kmsIntegration: false
  deployment:
    type: "Helm"
    repository: "oci://registry-1.docker.io/bitnamicharts/kafka"
  catalog:
    brokerType: platform
    sourceType: helm-registry # if no chart dir, requires sourceRepo and sourcePath
    sourceRepo: oci://registry-1.docker.io/bitnamicharts/kafka
    name: kafka
    images:
      # kafka — main broker workload
      - source: docker.io/bitnamilegacy/kafka:4.0.0-debian-12-r10
        destination: docker.io/bitnami/kafka:4.0.0-debian-12-r10

      # os-shell — init container (volume permissions, readiness helpers)
      - source: docker.io/bitnamilegacy/os-shell:12-debian-12-r51
        destination: docker.io/bitnami/os-shell:12-debian-12-r51

      # kubectl — init container (auto-discovery)
      - source: docker.io/bitnamilegacy/kubectl:1.33.4-debian-12-r0
        destination: docker.io/bitnami/kubectl:1.33.4-debian-12-r0

      # jmx-exporter — Prometheus metrics sidecar (metrics.jmx.enabled=true)
      - source: docker.io/bitnamilegacy/jmx-exporter:1.4.0-debian-12-r0
        destination: docker.io/bitnami/jmx-exporter:1.4.0-debian-12-r0
  links:
    docsUrl: "https://kafka.apache.org/documentation/"
    productPageUrl: "https://kafka.apache.org"
