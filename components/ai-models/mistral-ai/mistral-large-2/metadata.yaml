apiVersion: sovereign-catalog.io/v1alpha1
kind: ModelListing
metadata:
  companyRef: "companies/mistral-ai"
  vendor: "Mistral AI"
  product: "Mistral family"
  shortDescription: "Mistral AI's large language models, available on IBM Sovereign Core through IBM watsonx.ai. They support enterprise reasoning, agentic AI, and multilingual workloads that can run in the customer's own environment."
  fullDescription: |-
    IBM Sovereign Core clients can access Mistral AI models through the existing IBM and Mistral AI watsonx.ai offerings. The available model families are Mistral Large, Mistral Medium, Mistral Small, Codestral, Devstral, Magistral, Ministral, and Voxtral. Together they support retrieval-augmented generation (RAG), question answering, function calling, multilingual applications, vision, and coding.

    The Mistral Large models offer enterprise-grade reasoning and agentic AI capabilities. Mistral AI models are designed to perform well while using infrastructure efficiently, which can help organizations move AI beyond experimentation.

    Core capabilities:
    - Agentic AI that supports autonomous workflows and assistants.
    - Multilingual intelligence with support across global languages.
    - Efficient AI that is designed to optimize compute use.
    - Platform flexibility beyond hyperscaler-only services.

    What makes this offering different:
    - Available through IBM watsonx.ai on IBM Sovereign Core.
    - Can be deployed on premises.
    - Designed to support air-gapped environments.
    - Integrated with watsonx.ai.
    - Mistral AI's open-weight models are also available.

    Typical workflows include citizen services assistants for public sector agencies, financial research and analysis for banks and insurers, and enterprise knowledge agents that help employees find information, automate work, and make decisions faster.

    IBM part numbers: D0QN4ZX (Resource Unit Monthly License), D0QN5ZX (Resource Unit Subscription License), D0QN8ZX (Non-Production Resource Unit Monthly License), and D0QN9ZX (Non-Production Resource Unit Subscription License).
  sovereignCoreRelevance: "Mistral AI models on IBM Sovereign Core give organizations an option to run AI in their chosen environment, including on premises and in air-gapped deployments. Because AI can run where the data already lives, the models can suit organizations with sensitive or regulated data. Mistral AI is headquartered in France, which may interest organizations that want a regional AI strategy."
